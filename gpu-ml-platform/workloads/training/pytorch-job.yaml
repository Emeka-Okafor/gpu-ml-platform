apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-sample-training
  namespace: ml-workloads
  labels:
    app: pytorch-training
    workload-type: training
spec:
  template:
    metadata:
      labels:
        app: pytorch-training
    spec:
      restartPolicy: Never
      # Uncomment the following when you enable GPU nodes
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      # nodeSelector:
      #   workload-type: gpu
      containers:
        - name: trainer
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          command:
            - python
            - -c
            - |
              import torch
              print("PyTorch version:", torch.__version__)
              print("CUDA available:", torch.cuda.is_available())
              if torch.cuda.is_available():
                  print("GPU count:", torch.cuda.device_count())
                  print("GPU name:", torch.cuda.get_device_name(0))
              else:
                  print("Running on CPU (GPU nodes not enabled or not scheduled)")
              # Simple dummy training loop
              x = torch.randn(1000, 1000)
              y = torch.randn(1000, 1000)
              for i in range(50):
                  z = torch.matmul(x, y)
              print("Sample training completed successfully")
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
              # nvidia.com/gpu: 1   # Uncomment when using real GPUs
  backoffLimit: 2
