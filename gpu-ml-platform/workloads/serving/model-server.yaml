apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-model-server
  namespace: ml-workloads
  labels:
    app: model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: server
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-type", "application/json")
                      self.end_headers()
                      self.wfile.write(b'{"status": "ok", "model": "dummy-v1", "message": "Model serving example is running"}')
              print("Starting dummy model server on port 8080...")
              HTTPServer(("", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: ml-workloads
spec:
  selector:
    app: model-server
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
