apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<YOUR_GITHUB_USERNAME>/gpu-ml-platform.git  # ← CHANGE THIS
    targetRevision: HEAD
    path: workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
