name: FinOps - Cost Report & Cleanup

on:
  schedule:
    - cron: '0 8 * * *'   # Every day at 08:00 UTC
  workflow_dispatch:        # Allow manual runs

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: "us-east-1"

jobs:
  cost-report:
    name: Generate Cost Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 pandas tabulate

      - name: Run Cost Report
        id: report
        run: |
          python automation/finops/cost_report.py > cost_report.md
          cat cost_report.md

      - name: Create or Update GitHub Issue with Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('cost_report.md', 'utf8');
            const title = `📊 Daily FinOps Cost Report - ${new Date().toISOString().split('T')[0]}`;
            
            // Simple approach: always create a new issue
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: report,
              labels: ['finops', 'cost-report']
            });
