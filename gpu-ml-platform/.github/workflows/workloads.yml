name: Build & Validate Workloads

on:
  pull_request:
    paths:
      - 'workloads/**'
      - '.github/workflows/workloads.yml'
  push:
    branches: [main]
    paths:
      - 'workloads/**'

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubeval / kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform -summary -output pretty workloads/training/ || true
          kubeconform -summary -output pretty workloads/serving/ || true

